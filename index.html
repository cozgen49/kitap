<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* 1) Firebase ayarlarınızı yapıştırın */
const firebaseConfig = {
  apiKey: "AIzaSyDXR7p9BIB0WQ9fa-dw2Pqa6tGpdhgxt-g",
  authDomain: "okul-4f9ff.firebaseapp.com",
  projectId: "okul-4f9ff",
  appId: "1:1037904921330:web:aebe45e1dd0710f98a466b",
 };

/* Okul bilgileri: adı yazın, logo dosyasını bu HTML'nin yanına koyup adını yazın (örn. "logo.png") veya tam adres verin */
const OKUL_ADI = "OKUL ADINIZ";
const OKUL_LOGO = "logo.png";

/* 2) Sınıf ve ders listesi */
const VSINIF = [];
["1","2","3","4"].forEach(n => "ABCDE".split("").forEach(x => VSINIF.push(n+"/"+x)));
const VKITAP = [
 [1,"İlkokul Türkçe 1 Ders Kitabı"],[1,"İlkokul Türkçe 1 İlk Okuma Yazma Kitabı"],[1,"İlkokul Matematik 1"],[1,"İlkokul Hayat Bilgisi 1"],[1,"İlkokul Müzik 1"],
 [2,"İlkokul Türkçe 2 Ders Kitabı"],[2,"İlkokul Matematik 2"],[2,"İlkokul Hayat Bilgisi 2"],[2,"İlkokul Müzik 2"],[2,"İlkokul İngilizce 2"],
 [3,"İlkokul Türkçe 3 Ders Kitabı"],[3,"İlkokul Matematik 3"],[3,"İlkokul Hayat Bilgisi 3"],[3,"İlkokul Fen Bilimleri 3"],[3,"İlkokul İngilizce 3"],[3,"İlkokul Müzik 3"],
 [4,"İlkokul Türkçe 4 Ders Kitabı"],[4,"İlkokul Matematik 4"],[4,"İlkokul Fen Bilimleri 4"],[4,"İlkokul Sosyal Bilgiler 4"],[4,"İlkokul İngilizce 4"],[4,"İlkokul Din Kültürü ve Ahlak Bilgisi 4"],[4,"İnsan Hakları, Vatandaşlık ve Demokrasi 4"],[4,"İlkokul Trafik Güvenliği 4"],[4,"İlkokul Müzik 4"]];
const VDERSS = VKITAP.map(([g,a]) => g + "|" + a);
let SINIFLAR = [], KEYS = [], KG = {}, KM = {};
const gr = s => parseInt(s,10) || 0, kg = s => KG[gr(s)] || [];
function kur(o){
  SINIFLAR = (o.siniflar && o.siniflar.length) ? o.siniflar : VSINIF;
  let L = ((o.dersler && o.dersler.length) ? o.dersler : VDERSS).filter(l => /^\d+\|/.test(l));
  if (!L.length) L = VDERSS;
  KEYS = L.map(l => { const i = l.indexOf("|"), g = parseInt(l.slice(0,i),10), a = l.slice(i+1).trim(); return { k: g + ". " + a, label: a, g }; });
  KG = {}; KM = {}; KEYS.forEach(x => { (KG[x.g] = KG[x.g] || []).push(x); KM[x.k] = x; });
}
/* Ana ekran metinleri (yönetici panelinden değiştirilebilir) */
const VM = { alt:"Kitap ihtiyaç bildirimi", baslik:"Sınıfınızın kitap ihtiyacı", ust:"İki dakikada doldurun. Aynı sınıf için tekrar gönderirseniz son gönderiminiz geçerli olur.",
  k1:"Sınıf bilgisi", og:"Adınız soyadınız", sn:"Sınıf / şube", os:"Öğrenci sayısı", osph:"Örn. 24",
  k2:"Set", k2a:"1 set = sınıfınızın tüm ders kitapları ({n} kitap). Yazdığınız set adedi her kitaba otomatik eklenir.", sa:"Set adedi", saa:"Genelde öğrenci sayısı kadar", esit:"Öğrenci sayısı kadar yaz",
  k3:"Ders bazında ek ihtiyaç", k3a:"İsteğe bağlı. Sette olanın dışında ek kitap gerekiyorsa yazın. Altta her dersin toplamı görünür.",
  dg:"Başka ihtiyaç (isteğe bağlı)", dgph:"Örn. 2 adet öğretmen kitabı", dock:"kitap bildirilecek", btn:"GÖNDER",
  ok:"Bildiriminiz alındı", oka:"{s} sınıfı için {n} kitap bildirildi. Teşekkürler.", degis:"Değişiklik yap" };
const VML = { alt:"Üst çubuk alt yazısı", baslik:"Sayfa başlığı", ust:"Başlık altı açıklama", k1:"1. kart başlığı", og:"Ad soyad etiketi", sn:"Sınıf etiketi", os:"Öğrenci sayısı etiketi", osph:"Öğrenci sayısı örnek yazısı",
  k2:"Set kartı başlığı", k2a:"Set açıklaması ({n} = ders sayısı)", sa:"Set adedi etiketi", saa:"Set adedi alt yazısı", esit:"Hızlı doldurma bağlantısı", k3:"Ek ihtiyaç kartı başlığı", k3a:"Ek ihtiyaç açıklaması",
  dg:"Başka ihtiyaç etiketi", dgph:"Başka ihtiyaç örnek yazısı", dock:"Alt çubuk yazısı", btn:"Gönder düğmesi", ok:"Teşekkür başlığı", oka:"Teşekkür metni ({s} = sınıf, {n} = kitap)", degis:"Değişiklik düğmesi" };

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
let auth; try { auth = firebase.auth(); } catch (e) { auth = { onAuthStateChanged: cb => { cb(null); return () => {}; }, signOut(){}, setPersistence: async()=>{}, signInWithEmailAndPassword: async()=>{ throw 0; }, sendPasswordResetEmail: async()=>{ throw {code:"desteklenmiyor"}; } }; }
const COL = db.collection("talepler");
if (!/^https?:$/.test(location.protocol)) document.querySelector("main").insertAdjacentHTML("beforebegin", '<div class="msg err" style="width:calc(100% - 32px);max-width:640px;margin:12px auto"><b>Bu sayfa dosya olarak açılmış.</b> Veriler ve yönetici girişi çalışmaz. Dosyayı bir web adresine yükleyip (Firebase Hosting, Netlify vb.) o adresten açın.</div>');
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => Math.max(0, parseInt(v,10) || 0);
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}, del(k){try{localStorage.removeItem(k)}catch{}} };
const sum = r => { const l = kg(r.sinif); return (r.set||0)*l.length + l.reduce((a,x)=>a+((r.adet||{})[x.k]||0),0); };
const ef = (r,k) => { const x = KM[k]; return x && x.g === gr(r.sinif) ? (r.set||0) + ((r.adet||{})[k]||0) : 0; };
const docId = s => s.replace(/\//g,"-");
let unsub=null, unsubAuth=null, toastT;
function toast(t){ let e=$("tg"); if(!e){e=document.createElement("div");e.id="tg";e.className="tg";e.setAttribute("role","status");document.body.appendChild(e)} e.textContent=t;e.classList.remove("hide");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add("hide"),2600); }

/* Okul adı ve logo: Yönetici panelinden kaydedilir, Firestore'da saklanır, her cihazda görünür */
let OKUL = { ad: OKUL_ADI, logo: OKUL_LOGO };
try { const c = JSON.parse(store.get("okul") || "null"); if (c) OKUL = { ...OKUL, ...c }; } catch {}
kur(OKUL);
const T = k => (OKUL.metin && OKUL.metin[k]) || VM[k], TE = k => esc(T(k));
const PALET = { teal:["#0f766e","#4fd6c4","Yeşil-mavi"], blue:["#2456d6","#7aa7ff","Mavi"], purple:["#6d3fd1","#b69cff","Mor"], red:["#c62f3f","#ff8d98","Kırmızı"], orange:["#c2570c","#ffb066","Turuncu"], green:["#2f7d32","#7fd685","Yeşil"], pink:["#c2327f","#ff8fc6","Pembe"] };
function renkYaz(k){
  const e = document.documentElement, p = PALET[k || OKUL.renk] || PALET.teal, c = e.dataset.theme === "dark" ? p[1] : p[0];
  const n = parseInt(c.slice(1), 16), L = (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255;
  e.style.setProperty("--ac", c); e.style.setProperty("--acx", L > 0.6 ? "#0b1a18" : "#ffffff");
  e.style.setProperty("--ac2", "color-mix(in srgb," + c + " 20%,var(--sf))");
}
function okulYaz(){
  $("alt").textContent = T("alt");
  if (!store.get("tema")) { const m = OKUL.tema; html.dataset.theme = (m === "light" || m === "dark") ? m : (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); temaYaz(); }
  renkYaz();
  document.title = OKUL.ad + " - Kitap İhtiyacı"; $("okad").textContent = OKUL.ad;
  const l = $("lg0"); l.className = "logo"; l.textContent = "📚";
  if (OKUL.logo) { const im = new Image(); im.alt = OKUL.ad + " logosu"; im.onload = () => { l.textContent = ""; l.className = "logo img"; l.appendChild(im); }; im.src = OKUL.logo; }
}
db.collection("ayarlar").doc("okul").get().then(d => { if (d.exists) { const eski = JSON.stringify([OKUL.metin, OKUL.siniflar, OKUL.dersler]); OKUL = { ...OKUL, ...d.data() }; store.set("okul", JSON.stringify(d.data())); okulYaz(); if (JSON.stringify([OKUL.metin, OKUL.siniflar, OKUL.dersler]) !== eski) { kur(OKUL); route(); } } }).catch(e => { const x = document.getElementById("ayerr"); if (x) x.textContent = "Okul ayarları okunamadı (" + (e.code || "hata") + "). Firestore kuralında ayarlar için okuma izni herkese açık olmalı."; });
const kucult = f => new Promise((ok, no) => { const r = new FileReader(); r.onerror = no;
  r.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => { const k = Math.min(1, 256 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/png")); }; im.src = r.result; };
  r.readAsDataURL(f); });

/* Tema */
const html=document.documentElement, thBtn=$("th");
const temaYaz=()=>{thBtn.innerHTML=html.dataset.theme==="dark"?'☀<span class="tx"> Açık</span>':'🌙<span class="tx"> Koyu</span>'};
thBtn.onclick=()=>{html.dataset.theme=html.dataset.theme==="dark"?"light":"dark";store.set("tema",html.dataset.theme);temaYaz();renkYaz()};
temaYaz();
okulYaz();

function route(){
  if(unsub){unsub();unsub=null} if(unsubAuth){unsubAuth();unsubAuth=null}

    const tr=rs.map(r=>{const on=r.durum==="onay";return `<tr><td>${esc(r.sinif)}</td><td class="l">${esc(r.ogretmen)}</td><td>${r.ogrenci||""}</td><td>${r.set||""}</td>${cols.map(x=>`<td>${ef(r,x.k)||""}</td>`).join("")}<td><b>${sum(r)}</b></td><td class="l">${esc(r.diger)}</td><td><button class="tag ${on?"on":""}" data-o="${r.id}" data-v="${on?"bekliyor":"onay"}" title="Durumu değiştir">${on?"Onaylandı":"Bekliyor"}</button></td><td><button class="gh dg" data-x="${r.id}" aria-label="${esc(r.sinif)} bildirimini sil">Sil</button></td></tr>`}).join("");
    $("tb").innerHTML=`<table><thead><tr>${th.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${tr||`<tr><td colspan="${th.length}" style="text-align:left;font-weight:400">${rows.length?"Filtreye uyan bildirim yok.":"Henüz bildirim yok. Öğretmenlere formun bağlantısını gönderin."}</td></tr>`}<tr class="tot"><td>TOPLAM</td><td></td><td>${t.ogr}</td><td>${t.set}</td>${cols.map(x=>`<td>${t.k[x.k]}</td>`).join("")}<td>${t.all}</td><td></td><td></td><td></td></tr></tbody></table>`;
    $("kl").innerHTML=rs.map(r=>{const on=r.durum==="onay";return `<div class="kc"><div class="h"><div><b>${esc(r.sinif)}</b><small>${esc(r.ogretmen)}${r.ogrenci?" · "+r.ogrenci+" öğrenci":""}</small></div><button class="tag ${on?"on":""}" data-o="${r.id}" data-v="${on?"bekliyor":"onay"}">${on?"Onaylandı":"Bekliyor"}</button></div><ul>${KEYS.filter(x=>ef(r,x.k)).map(x=>`<li>${esc(x.label.replace(". kitap",""))}: <b>${ef(r,x.k)}</b></li>`).join("")}</ul>${r.diger?`<p>Not: ${esc(r.diger)}</p>`:""}<div class="f2"><span>Toplam <b>${sum(r)}</b> kitap${r.set?" · "+r.set+" set":""}</span><button class="gh dg" data-x="${r.id}">Sil</button></div></div>`}).join("")||`<p class="sub">${rows.length?"Filtreye uyan bildirim yok.":"Henüz bildirim yok."}</p>`;
    $("csv").onclick=()=>{
      const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"', h=["Sınıf","Öğretmen","Öğrenci","Set",...cols.map(x=>x.label),"Toplam","Başka ihtiyaç","Durum"];
      const L=[h.map(c).join(";")];
      rs.forEach(r=>L.push([r.sinif,r.ogretmen,r.ogrenci||0,r.set||0,...cols.map(x=>ef(r,x.k)),sum(r),r.diger,r.durum==="onay"?"Onaylandı":"Bekliyor"].map(c).join(";")));
      L.push(["TOPLAM","",t.ogr,t.set,...cols.map(x=>t.k[x.k]),t.all,"",""].map(c).join(";"));
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"})); a.download="kitap_ihtiyaci.csv"; a.click();
    };
  }
  $("tb").onclick=$("kl").onclick=async e=>{
    const o=e.target.closest("[data-o]"), x=e.target.closest("[data-x]");
    try{
      if(o){await COL.doc(o.dataset.o).update({durum:o.dataset.v});toast(o.dataset.v==="onay"?"Onaylandı":"Beklemeye alındı")}
      if(x&&confirm("Bu sınıfın bildirimi silinsin mi?")){await COL.doc(x.dataset.x).delete();toast("Bildirim silindi")}
    }catch(err){toast("İşlem yapılamadı ("+err.code+")")}
  };
  unsub=COL.onSnapshot(snap=>{
    rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.sinif.localeCompare(b.sinif,"tr",{numeric:true}));
    ozet(); cizTablo();
  },err=>{$("ey").innerHTML=`<div class="msg err">Veriler okunamadı: ${esc(err.code)}. Firestore kurallarını kontrol edin.</div>`});
}
route();
</script>
</body>
</html>
